# Policy for the brownfield example.
#
# The production root is the schema, because in a brownfield adoption the schema is the part of the
# system that already exists and that the specifications are being written against.

spec_glob = "specs/*/spec.md"
traceability_file = "traceability.toml"
require_test_files = false

test_command = "pytest"

production_roots = ["src"]
test_roots = ["tests"]
source_extensions = [".sql"]

state_space_budget = 1000000

# Phase two. Both layers are off by default because they need files a new project does not have.
# This project has them, so it asks for the checks that read them.
#
# They are enabled together on purpose: a guard is written over declared terms and type-checked
# against their domains, so the constraint layer without the vocabulary layer is unsound rather than
# merely narrower. The validator refuses that combination.
[checks]
vocabulary = true
constraints = true
