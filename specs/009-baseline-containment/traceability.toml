schema_version = "1.0"

# Selectors name the evidence each requirement is to be held to, whether or not that evidence
# exists yet. Naming it before it exists is how this project records work that has not been done:
# a selector pointing at an absent file is reported as TRACE_TEST_FILE, so the gate's own output is
# the list of what is left.
#
# Seven cases under conformance/pending/contain-* belong to this feature. They live in pending/
# rather than cases/ because the corpus runner executes every directory under cases/ against the
# current binary, and containment is not implemented, so placing them there would leave the suite
# red for as long as the feature takes. They move to cases/ when it lands, and these selectors move
# with them. The contain-envelope-* cases belong to 010-envelope-containment.

[requirements.REQ-001]
verification = "automated"
tests = ["conformance/cases/contain-equal/expected.json"]
tags = ["constraint-model", "scope"]
intent = "no-unearned-pass"

[requirements.REQ-002]
verification = "automated"
tests = ["conformance/cases/contain-reference-missing/expected.json"]
tags = ["constraint-model", "finding"]
intent = "no-unearned-pass"

