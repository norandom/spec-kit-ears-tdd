schema_version = "1.0"

# Selectors name the evidence each requirement is to be held to, whether or not that evidence
# exists yet. One case, contain-envelope-widened, is written and parked under conformance/pending/
# (it was written for 009 before the 2026-09-22 split). The rest are reported as missing files,
# which is this project's way of listing the work.

[requirements.REQ-001]
verification = "automated"
tests = ["conformance/cases/contain-envelope-widened/expected.json"]
tags = ["constraint-model"]
intent = "adoptable-incrementally"

