# Policy for this repository. Paths are relative to the project root.
#
# Updated for the Rust layout. Before this the file still described the Python one
# (production_roots = ["src", "app", "lib"], test_roots = ["tests"]), none of which exist any more,
# so the separation gate was scanning nothing at all and saying so through three
# PRODUCTION_ROOT_MISSING warnings.
spec_glob = "specs/*/spec.md"
traceability_file = "traceability.toml"
require_test_files = true

test_command = "cargo nextest run"

# Requirement prose and IDs must not be copied into these production-code roots.
production_roots = ["crates"]

# Both roots hold verification: Rust tests live beside the code and as integration tests under
# crates/, and the behavioural corpus is data under conformance/.
test_roots = ["crates", "conformance"]

source_extensions = [".rs"]

# Selectors whose backing files are staged but not yet written are parked advisories
# (TRACE_TEST_PARKED), not errors. The pending corpus plus the planned 009/010 implementation
# files, which land with those features and then get their normal name checks.
parked_selector_prefixes = [
  "conformance/pending/",
  "crates/ears-sdd/src/contain.rs",
  "crates/ears-sdd/src/envelope.rs",
  "crates/ears-sdd/src/adapters.rs",
  "crates/ears-sdd/tests/determinism.rs",
]

# Phase two, partially. This project declares a vocabulary and intentions and tags its requirements,
# so the grounding layer has something to read and is enabled.
#
# The constraint layer is not, because no specification here declares a model. Enabling it would add
# a check that returns clean because it found no files, which is the shape of result this project
# exists to make impossible. The two worked examples under examples/ do declare models and do enable
# it, which is where that layer is exercised.
[checks]
vocabulary = true
