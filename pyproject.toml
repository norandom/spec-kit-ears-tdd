[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spec-kit-ears-tdd"
version = "0.1.0"
description = "Reusable EARS requirements and test-traceability policy for GitHub Spec Kit"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "specify-cli==0.16.3",
]

[project.urls]
Homepage = "https://github.com/norandom/spec-kit-ears-tdd"
Repository = "https://github.com/norandom/spec-kit-ears-tdd"
Issues = "https://github.com/norandom/spec-kit-ears-tdd/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
ears-sdd = "ears_sdd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ears_sdd"]

[tool.hatch.build.targets.wheel.force-include]
"components" = "ears_sdd/assets/components"
"config" = "ears_sdd/assets/config"
"launchers" = "ears_sdd/assets/launchers"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true
