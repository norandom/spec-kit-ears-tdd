schema_version = "1.0"

[terms.maintenance-window]
label = "Maintenance window"
definition = "Whether the workstation is inside a scheduled maintenance window."
domain = { kind = "bool" }

[terms.test-result]
label = "Test result"
definition = "The outcome of the last test run the agent observed."
domain = { kind = "enum", values = ["pass", "fail"] }
