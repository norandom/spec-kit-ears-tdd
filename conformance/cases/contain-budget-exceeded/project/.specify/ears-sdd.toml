spec_glob = "specs/*/spec.md"
traceability_file = "traceability.toml"
require_test_files = true
test_command = "cargo nextest run"
production_roots = ["src"]
test_roots = ["tests"]
source_extensions = [".py", ".rs"]
state_space_budget = 4

[checks]
vocabulary = true
constraints = true
containment = true
