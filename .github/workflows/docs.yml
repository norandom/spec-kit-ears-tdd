# Builds the documentation on every change and publishes it from main.
#
# The build runs on pull requests too, without deploying. `mkdocs.yml` sets `strict: true`, so a
# broken internal link or a page missing from the navigation fails here rather than shipping as a
# dead link on the published site.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # These three are on majors that run on Node 24. The previous versions targeted Node 20,
      # which the runners now force onto 24 while warning about it, and a warning nobody can act on
      # is one people stop reading. upload-pages-artifact@v5 matters for a second reason: it is a
      # composite action, and the deprecated runtime was in the upload-artifact it delegates to
      # rather than in anything written here.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install
        run: pip install -r docs/requirements.txt

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
